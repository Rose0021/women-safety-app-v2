<!DOCTYPE html>
<html>
<head>
<title>Police Help</title>

<style>
body {
    background: #0f2027;
    color: white;
    font-family: Arial;
    text-align: center;
}

/* BIG BUTTON */
.big-call-btn {
    padding: 20px 50px;
    font-size: 22px;
    background: red;
    color: white;
    border: none;
    border-radius: 50px;
    box-shadow: 0 0 30px red;
    animation: pulse 1.5s infinite;
    margin-top: 20px;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px red; }
    50% { box-shadow: 0 0 40px red; }
    100% { box-shadow: 0 0 10px red; }
}

/* CARD */
.card {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.distance {
    font-size: 14px;
    margin: 5px 0;
}

.btn {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
}

.call { background: red; color: white; }
.map { background: blue; color: white; }
</style>
</head>

<body>

<h1>🚓 Police Assistance</h1>

<!-- BIG CALL BUTTON -->
<a href="tel:100">
    <button class="big-call-btn">🚨 CALL POLICE (100)</button>
</a>

<div id="list"></div>

<script>

document.getElementById("list").innerHTML =
    "<p>📍 Getting your location...</p>";

if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(success, error);

    function success(pos){
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        fetch(`/get_police?lat=${lat}&lon=${lon}`)
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach((p) => {
                html += `
                <div class="card">
                    <div class="title">🚓 ${p.name}</div>
                    <div class="distance">${p.distance} km away</div>

                    <button class="btn call" onclick="callPolice()">📞 Call</button>
                    <button class="btn map" onclick="openMap(${p.lat}, ${p.lon})">🗺 Map</button>
                </div>`;
            });

            document.getElementById("list").innerHTML = html;
        });
    }

    function error(){
        document.getElementById("list").innerHTML =
            "<p>⚠ Allow location</p>";
    }
}

function openMap(lat, lon){
    window.open(`https://maps.google.com/?q=${lat},${lon}`);
}

function callPolice(){
    window.location.href = "tel:100";
}

</script>

</body>
</html>
