<!DOCTYPE html>
<html>
<head>
<title>Child Help</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0f2027, #000);
    color: white;
    font-family: 'Segoe UI';
    text-align: center;
}

.container {
    padding: 30px;
}

/* Header */
h1 {
    color: #4da6ff;
}

/* BIG BUTTON */
.call-btn {
    margin-top: 20px;
    padding: 20px 40px;
    font-size: 20px;
    background: #3498db;
    border: none;
    border-radius: 50px;
    color: white;
    box-shadow: 0 0 30px #3498db;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px #3498db; }
    50% { box-shadow: 0 0 40px #3498db; }
    100% { box-shadow: 0 0 10px #3498db; }
}

/* Glass Card */
.card {
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.08);
}

/* Map */
iframe {
    width: 100%;
    height: 300px;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🧒 Child Help</h1>

    <a href="tel:1098">
        <button class="call-btn">🚨 CALL CHILD HELPLINE (1098)</button>
    </a>

    <div class="card">
        <h3>Nearby Help Centers</h3>
        <iframe src="https://maps.google.com/maps?q=child helpline near me&output=embed"></iframe>
    </div>
</div>

</body>
</html>
