<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, #0f2027, #000);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
    backdrop-filter: blur(15px);
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    cursor: pointer;
}

a {
    color: #00c6ff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="card">
    <h2>👤 Profile</h2>

    <p><b>Username:</b> {{ user[0] }}</p>
    <p><b>Email:</b> {{ user[1] }}</p>

    <form method="POST" action="/update_profile">
        <input name="emergency" value="{{ user[2] }}" required>
        <button>Update Emergency Contact</button>
    </form>

    <br>
    <a href="/">⬅ Back to Home</a>
</div>

</body>
</html>
