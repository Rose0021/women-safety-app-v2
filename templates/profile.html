<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    box-shadow:0 0 40px rgba(0,255,255,0.15);
    text-align:center;
}

h2{
    margin-bottom:20px;
}

.input-group{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    padding:12px;
    margin-bottom:15px;
}

.input-group i{
    margin-right:10px;
    color:#00c6ff;
}

input{
    width:100%;
    border:none;
    outline:none;
    background:none;
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.back-btn{
    margin-top:15px;
    display:inline-block;
    color:#00c6ff;
    text-decoration:none;
}

.success{
    color:#00ff99;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="card">

    <h2>👤 Emergency Profile</h2>

    <form action="/update_profile" method="POST">

        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text"
            value="{{ user[0] }}"
            disabled>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email"
            value="{{ user[1] }}"
            disabled>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email"
            name="c1"
            placeholder="Emergency Email 1"
            value="{{ user[2] if user[2] else '' }}">
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email"
            name="c2"
            placeholder="Emergency Email 2"
            value="{{ user[3] if user[3] else '' }}">
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email"
            name="c3"
            placeholder="Emergency Email 3"
            value="{{ user[4] if user[4] else '' }}">
        </div>

        <button type="submit">
            Save Emergency Emails
        </button>

    </form>

    <a href="/" class="back-btn">
        ⬅ Back to Home
    </a>

</div>

</body>
</html>
