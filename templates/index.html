<!DOCTYPE html>
<html>
<head>
<title>Safety App</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #0f2027, #000);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    padding-top: 80px;
    overflow-y: auto;
}

/* flashing danger */
.flash {
    animation: flash 0.5s infinite alternate;
}

@keyframes flash {
    from { background: #000; }
    to { background: #300; }
}

/* logout */
.logout {
    position: absolute;
    top: 20px;
    right: 20px;
    background: red;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
}

/* profile */
.profile-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

/* SOS */
.sos {
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff0000, #8b0000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 60px red;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

#msg {
    margin-top: 20px;
}

/* 🚨 Emergency Section */
.emergency-section {
    margin-top: 40px;
    text-align: center;
    width: 100%;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
}

.emergency-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 10px;
}

.emergency-btn {
    padding: 12px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    display: block;
}

.police { background: #e74c3c; }
.child { background: #3498db; }
.ambulance { background: #2ecc71; }
.women { background: #9b59b6; }

.emergency-btn:hover {
    opacity: 0.85;
}

/* 💎 PREMIUM GLASS CARDS */
.card {
    padding: 18px;
    border-radius: 18px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    text-align: center;
    cursor: pointer;
    transition: 0.3s ease;
    position: relative;
    overflow: hidden;
}

.card i {
    font-size: 26px;
    margin-bottom: 8px;
}

.card span {
    display: block;
    font-size: 14px;
}

.card:hover {
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

.card::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: 0.4s;
}

.card:active::after {
    width: 220px;
    height: 220px;
}

.police { color: #ff4d4d; }
.child { color: #4da6ff; }
.ambulance { color: #2ecc71; }
.women { color: #d980fa; }
/* PREVENT CONTENT HIDE */
body h1 {
    text-align: center;
    margin-top: 20px;
}

.sos {
    margin: 30px auto;
}
</style>
</head>

<body>


<!-- PROFILE -->
<a href="/profile" class="profile-btn">
    <i class="fas fa-user-circle"></i>
</a>

<!-- LOGOUT -->
<a href="/logout" class="logout">Logout</a>

<h1>🚨 EMERGENCY MODE</h1>

<!-- SOS -->
<div class="sos" onclick="triggerSOS()">SOS</div>

<!-- 🚨 EMERGENCY BUTTONS -->
<div class="emergency-section">
    <h3>Emergency Assistance</h3>

    <div class="emergency-buttons">

        <a href="/police" style="text-decoration:none; display:block;">
    <div class="card police">
        <i class="fas fa-shield-alt"></i>
        <span>Police</span>
    </div>
</a>

        <a href="/child" style="text-decoration:none; display:block;">
    <div class="card child">
        <i class="fas fa-child"></i>
        <span>Child Help</span>
    </div>
</a>
        <a href="/ambulance" style="text-decoration:none; display:block;">
    <div class="card ambulance">
        <i class="fas fa-ambulance"></i>
        <span>Ambulance</span>
    </div>
</a>

        <a href="/women" style="text-decoration:none; display:block;">
    <div class="card women">
        <i class="fas fa-female"></i>
        <span>Women Help</span>
    </div>
</a>

    </div>
</div>

<p id="msg"></p>

<audio id="alarm" src="https://www.soundjay.com/button/beep-07.wav" loop></audio>

<script>
function triggerSOS() {
    document.body.classList.add("flash");
    document.getElementById("alarm").play();

    if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500, 200]);
    }

    sendLocation();
    sendEmail();
    sendWhatsApp();
}

function sendLocation() {
    navigator.geolocation.watchPosition(function(pos) {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        fetch('/send_location', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({latitude: lat, longitude: lon})
        });

        document.getElementById("msg").innerText = "Location sending...";
    });
}

function sendEmail() {
    fetch('/send_alert', {method:'POST'})
    .then(res => res.text())
    .then(data => {
        document.getElementById("msg").innerText = data;
    });
}

function sendWhatsApp() {
    navigator.geolocation.getCurrentPosition(function(pos) {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        let message = `🚨 HELP! My location: https://maps.google.com/?q=${lat},${lon}`;
        let url = "https://wa.me/?text=" + encodeURIComponent(message);

        window.open(url, "_blank");
    });
}

/* IMPORTANT FIX */
function callNumber(num) {
    console.log("Call disabled for debug:", num);
}

</script>
</body>
</html>
